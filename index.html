<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Kombi Exchange</title>
    <meta
      name="description"
      content="Riesenschein-Terminal: Wettscheine aus Bildern lesen, zu einer Grosskombi zusammenfuehren, als Blatt und Excel ausgeben."
    />
    <meta name="color-scheme" content="dark light" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230b0f16'/%3E%3Cpath d='M6 22 L11 14 L16 18 L26 7' stroke='%2318c98a' stroke-width='2.5' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />

    <!--
      Die Designschicht. Diese vier Dateien duerfen komplett geloescht werden.
      Danach sieht die Seite nackt aus und funktioniert vollstaendig weiter.
      Es entsteht in ihnen kein einziges Rechenergebnis.
    -->
    <link rel="stylesheet" href="stil/marken.css" />
    <link rel="stylesheet" href="stil/grund.css" />
    <link rel="stylesheet" href="stil/bauteile.css" />
    <link rel="stylesheet" href="stil/buehne.css" />
  </head>
  <body>
    <div id="wurzel"></div>

    <noscript>
      <p style="padding: 2rem">
        Dieses Programm rechnet vollstaendig im Browser. Dafuer muss JavaScript erlaubt sein.
      </p>
    </noscript>

    <script type="module">
      import { starte } from './oberflaeche/app.js'

      const wurzel = document.getElementById('wurzel')

      // Die Buehne ist optional. Faellt sie weg, laeuft alles ohne Bewegung weiter.
      import('./stil/buehne.js')
        .then((buehne) => buehne.starte())
        .catch(() => {})

      starte(wurzel).catch((fehler) => {
        console.error('[Start]', fehler)
        wurzel.textContent = `Das Programm konnte nicht starten: ${fehler?.message ?? fehler}`
      })
    </script>
  </body>
</html>
